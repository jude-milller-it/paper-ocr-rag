        code_language: python3
        code: "def main(records: list) -> dict:\n    out=[]\n    seen=set()\n    for item in (records or []):\n\
          \        if not isinstance(item,dict): continue\n        content=str(item.get('content') or '').strip()\n\
          \        if len(content)<45 or content in seen: continue\n        seen.add(content)\n        md=item.get('metadata')\
          \ or {}\n        title=str(item.get('title') or md.get('document_name') or '未知文档')\n        out.append('【来源：'+title+'；分段\
          \ '+str(md.get('segment_position','未知'))+'】\\n'+content[:1800])\n        if len(out)>=5: break\n    return\
          \ {'evidence': ('\\n\\n'.join(out))[:7000] if out else '【证据不足】知识库未检索到相关正文。'}\n"
        variables:
        - value_selector:

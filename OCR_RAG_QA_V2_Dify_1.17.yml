    - id: '991060'
      type: custom
      data:
        title: 多路证据融合 + 覆盖检查
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import re\n\ndef main(methods: list, datasets: list, results: list) -> dict:\n    groups=[('提出的方法/核心创新',methods),('数据集/研究资源',datasets),('本文实验结果/结论',results)]\n\
          \    seen=set()\n    sections=[]\n    for label,records in groups:\n        ranked=[]\n        for item\
          \ in (records or []):\n            if not isinstance(item,dict): continue\n            c=str(item.get('content')\
          \ or '').strip()\n            if len(c)<50 or c in seen: continue\n            md=item.get('metadata')\
          \ or {}\n            title=str(item.get('title') or md.get('document_name') or '')\n            upper=title.upper()\n\
          \            boost=1 if '__OVERVIEW' in upper else 0\n            if label.startswith('提出') and ('ABSTRACT'\
          \ in upper or 'METHOD' in upper or 'INTRODUCTION' in upper): boost+=2\n            if label.startswith('数据')\
          \ and ('DATASET' in upper or 'AVA_' in upper or 'DATA' in upper): boost+=2\n            if label.startswith('本文实验')\
          \ and ('EXPERIMENT' in upper or 'CONCLUSION' in upper or 'CLASSIFICATION' in upper): boost+=2\n      \
          \      # source citations of other works should not be treated as this paper's innovation\n          \
          \  if re.search(r'\\baccording to (?:the experimental results|results).*?\\[\\d+\\]', c, re.I): boost-=2\n\
          \            ranked.append((boost,item,c,title))\n        ranked.sort(key=lambda x:-x[0])\n        parts=[]\n\
          \        for _,item,c,title in ranked:\n            if c in seen: continue\n            seen.add(c)\n\
          \            md=item.get('metadata') or {}\n            parts.append('【来源：'+title+'；分段 '+str(md.get('segment_position','未知'))+'】\\\
          n'+c[:1250])\n            if len(parts)==3: break\n        sections.append('## '+label+'\\n'+('\\n\\n'.join(parts)\
          \ if parts else '【当前无对应检索证据】'))\n    return {'evidence': ('\\n\\n'.join(sections))[:10500]}\n"
        variables:
        - value_selector:
          - '991050'
          - result
          variable: methods
        - value_selector:
          - '991051'
          - result
          variable: datasets
        - value_selector:
          - '991052'
          - result
          variable: results
        outputs:
          evidence:
            type: string

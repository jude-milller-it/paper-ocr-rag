    - id: '991031'
      type: custom
      data:
        title: 图表编号过滤 + 来源绑定
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import re\n\ndef main(records: list, label: str) -> dict:\n    records = records or []\n    m = re.match(r'^(Figure|Table)\\\
          s+(\\d+)$', label or '', re.I)\n    if not m:\n        return {'evidence': '【无对应图表证据】未识别到明确图表编号。'}\n \
          \   typ, num = m.group(1), int(m.group(2))\n    patt = re.compile(r'\\b(?:'+ ('fig(?:ure)?' if typ.lower()=='figure'\
          \ else 'table') +r')\\s*[.：:#-]?\\s*0*'+str(num)+r'\\b', re.I)\n    filetag = (('FIGURE' if typ.lower()=='figure'\
          \ else 'TABLE') + '_' + f'{num:02d}')\n    zh = ('图' if typ.lower()=='figure' else '表') + str(num)\n \
          \   out = []\n    for item in records:\n        if not isinstance(item, dict): continue\n        content\
          \ = str(item.get('content') or '').strip()\n        md = item.get('metadata') or {}\n        title = str(item.get('title')\
          \ or md.get('document_name') or '')\n        head = content[:500]\n        # only this figure/table; never\
          \ borrow labels from adjacent chunks\n        score = 3 if filetag in title.upper() else (2 if patt.search(head)\
          \ else (1 if zh in head else 0))\n        if score == 0 or not content: continue\n        out.append((score,\
          \ item, content, title))\n    out.sort(key=lambda x:-x[0])\n    if not out:\n        return {'evidence':\
          \ f'【无对应图表证据】未检索到明确属于 {label} 的片段；严禁使用其他 Figure / Table 替代。'}\n    lines=[]\n    used=set()\n    for _,item,content,title\
          \ in out[:3]:\n        if content in used: continue\n        used.add(content)\n        md=item.get('metadata')\
          \ or {}\n        lines.append('【来源：'+title+'；分段 '+str(md.get('segment_position','未知'))+'】\\n'+content[:3000])\n\
          \    return {'evidence': ('\\n\\n'.join(lines))[:6000]}\n"
        variables:
        - value_selector:
          - '991030'
          - result
          variable: records
        - value_selector:
          - '991010'
          - label
          variable: label
        outputs:
          evidence:
            type: string

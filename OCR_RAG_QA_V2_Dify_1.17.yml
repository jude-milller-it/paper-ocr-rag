    - id: '991010'
      type: custom
      data:
        title: 识别问题类型 / 改写检索词
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import re\n\ndef main(question: str) -> dict:\n    q = (question or '').strip()\n    en = re.search(r'(?i)\\\
          b(fig(?:ure)?|table)\\s*[.：:#-]?\\s*0*(\\d{1,3})\\b', q)\n    zh = re.search(r'(图|表)\\s*0*(\\d{1,3})(?!\\\
          d)', q)\n    typ = ''\n    num = 0\n    if en:\n        typ = 'Figure' if en.group(1).lower().startswith('fig')\
          \ else 'Table'\n        num = int(en.group(2))\n    elif zh:\n        typ = 'Figure' if zh.group(1) ==\
          \ '图' else 'Table'\n        num = int(zh.group(2))\n    label = (typ + ' ' + str(num)) if typ else ''\n\
          \    overview_pattern = (r'主要贡献|创新点|论文贡献|贡献是什么|全文|整篇|总结|概述|研究成果|'\n                        r'综合分析|核心工作|核心创新|主要结论|贡献包括|'\n\
          \                        r'\\bcontributions?\\b|\\bnovelt(?:y|ies)\\b|\\bsummar(?:y|ize|ise)\\b|\\boverview\\\
          b')\n    is_overview = bool(re.search(overview_pattern, q, flags=re.I))\n    route = 'exact' if label\
          \ else ('overview' if is_overview else 'general')\n    # 不能绑定某一篇论文：查询词都是通用的，任意论文均可用。\n    return {\n \
          \       'route': route,\n        'label': label,\n        'query_exact': (label + ' ' + q + ' ' + label\
          \ + ' results caption data accuracy')[:240],\n        'query_general': q[:240],\n        'query_method':\
          \ ('paper proposed new method model approach novelty architecture methodology '\n                    \
          \     '本文提出的方法 模型 主要创新 联合表示 ' + q)[:240],\n        'query_dataset': ('paper contribution created constructed\
          \ dataset resource benchmark corpus '\n                          '本文新构建的数据集 研究资源 数据来源 ' + q)[:240],\n\
          \        'query_results': ('paper experiments results comparisons ablation accuracy improvement '\n  \
          \                        'conclusions 本文实验结果 性能对比 结论 ' + q)[:240],\n    }\n"
        variables:
        - value_selector:
          - '991000'
          - question
          variable: question
        outputs:
          route:
            type: string
          label:
            type: string
          query_exact:
            type: string
          query_general:
            type: string
          query_method:
            type: string
          query_dataset:
            type: string
          query_results:
